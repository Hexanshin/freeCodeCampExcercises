<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <h1>Donation Form</h1>
  <form>
    
    <label for = "fullname">Full Name:</label>
    <input type="text" name="name" id = "fullname" required>

    <label for = "emailadd">Email Address:</label>
    <input type="email" name="email" 
    id = "emailadd" required>

    <label for = "amountdonated">Donation Amount ($):</label>
    <input type="number" name="amount" id = "amountdonated" required>


    <label for = "newsletters">Subscribe</label>
    <input type="checkbox" name="newsletter" id ="newsletters">


    <input type="submit" value="Send" id = "send">
  </form>
</body>
</html>
