<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id = "title">This is the Title</h1>
    <p id = "description">This is short description.</p>
    <form id = "survey-form">
      <label id = "name-label">Name</label>
      <input id = "name" type = "text" required placeholder = "John Doe"></input> <br>
      <label id = "email-label">Email</label>
      <input id = "email" type = "email" required placeholder = "test@gmail.com"></input><br>
      <label id = "number-label">Number</label>
      <input id = "number" type = "number" min = "3" max = "10" placeholder = "2"></input><br>
      
      <p>Which type of person are you?</p>
      <select id = "dropdown">
        <option>Lmaom</option>
        <option>Lol</option>
      </select> <br>

      <p>Are you gay?</p>
      <input type = "radio" value = "lol" name = "rbtn">Yes</input>
      <input type = "radio" value = "lol" name = rbtn>No</input> <br>

      <p>Which do you like?</p>
      <input type = "checkbox" value = "what">Men</input>
      <input type = "checkbox" value = "what">Boys</input><br>

      <p>What would you like to say to Netanyahu?</p>
      <textarea placeholder = "Fuck Netanyahu"></textarea><br>
      <input type = "submit" id = "submit"></input>
    </form>
  </body>
</html>
