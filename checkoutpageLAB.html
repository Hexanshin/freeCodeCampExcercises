<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
        
    <section>
        <h2>Your Cart</h2>
        <img src = "https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt = "An unsolved Rubik's cube.">

    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for = "card-name">Card Name<span aria-hidden = "true">*</span></label>
            <input id = "card-name" 
            name = "card-name"
            type = "text"
            required></input>

            <label for = "card-number">Card Number<span aria-hidden = "true">*</span></label>
            <input id = "card-number" 
            name = "card-number"
            type = "text"
            required
            aria-describedby = "card-number-help"></input>


            <p id="card-number-help">Format: 1234 5678 9012 3456</p>

            <p>This is not empty</p>
        </form>
    </section>
</body>

</html>
