<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class = "main-box">
        <h1>To Do List</h1>
        <hr>
        <ul class = "todo-list">

            <li class = "listsec">
                <input type = "checkbox" id = "task1"></input>
                <label for = "task1">Watch Call of the Night</label>
                <ul class = "sub-item">
                    <li><a class = "sub-item-link" href = "https://www3.anikai.cc/watch/call-of-the-night/ep-3" target = "_blank">Watch Here</a></li>
                </ul>
            </li>

            <br>
            
            <li class = "listsec">
                <input type = "checkbox" id = "task2"></input>
                <label for = "task2">Complete FreeCodeCamp Tasks</label>
                <ul class = "sub-item">
                    <li><a class = "sub-item-link" href = "https://www.freecodecamp.org" target = "_blank">FCC Link</a></li>
                </ul>
            </li>

            <br>

            <li class = "listsec">
                <input type = "checkbox" id = "task3"></input>
                <label for = "task3">Do Daily Push on GitHub</label>
                <ul class = "sub-item">
                    <li><a class = "sub-item-link" href = "https://github.com/Hexanshin" target = "_blank">GitHub Link</a></li>
                </ul>
            </li>

            <br>
            
            <li class = "listsec">
                <input type = "checkbox" id = "task4"></input>
                <label for = "task4">Eat Something</label>
                <ul class = "sub-item">
                    <li><a class = "sub-item-link" href = "https://www.youtube.com" target = "_blank">Links to Make you Hungry</a></li>
                </ul>
            </li>


        </ul>
    </div>
</body>

</html>
